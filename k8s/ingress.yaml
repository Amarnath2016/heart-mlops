# Optional alternative to the LoadBalancer (requires an ingress controller, e.g. `minikube addons enable ingress`)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
spec:
  rules:
    - host: heart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: heart-api, port: {number: 80}}
