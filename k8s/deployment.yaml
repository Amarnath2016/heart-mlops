apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels: {app: heart-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-api}
  template:
    metadata:
      labels: {app: heart-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: heart-api
          image: heart-api:latest          # replace with <registry>/heart-api:<tag> on a cloud cluster
          imagePullPolicy: IfNotPresent    # lets Minikube/Docker Desktop use a locally built image
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
